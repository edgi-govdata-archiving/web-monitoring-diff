version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      time: "10:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: beautifulsoup4
        versions:
          - "< 4.6.2"
          - ">= 4.6.1.a"

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
