version: 2.1

parameters:
  # Version of Python to use for jobs that don't have a specific setting.
  # Basically, for everything but tests.
  primary-python-version:
    type: string
    default: "3.14"
  # Name of Docker image to publish.
  docker-image:
    type: string
    # default: "envirodgi/web-monitoring-diff"
    default: "envirodgi/test-publish"
  # Publish Docker "edge" tag from this branch.
  edge-branch:
    type: string
    default: "main"

commands:
  setup_pip:
    description: "Set Up Dependencies"
    parameters:
      python-version:
        type: string
      install-docs:
        description: Install docs dependencies
        type: boolean
        default: false
      chardet:
        type: string
        default: ""
    steps:
      - restore_cache:
          keys:
            - cache-v7-{{ arch }}-python<< parameters.python-version >>-<< parameters.chardet >>-{{ checksum "pyproject.toml" }}-{{ checksum "requirements-experimental.txt" }}
            - cache-v7-{{ arch }}-python<< parameters.python-version >>-<< parameters.chardet >>-{{ checksum "pyproject.toml" }}-
            - cache-v7-{{ arch }}-python<< parameters.python-version >>-<< parameters.chardet >>-

      - run:
          name: Install Dependencies
          command: |
            python -m venv ~/venv
            . ~/venv/bin/activate
            # Ensure pip is up-to-date
            pip install --upgrade pip
            pip install ".[server,dev]" --no-binary lxml
            pip install -r requirements-experimental.txt

      - when:
          condition: << parameters.chardet >>
          steps:
            - run:
                command: |
                  . ~/venv/bin/activate
                  pip install << parameters.chardet >>

      # Docs dependencies are only compatible on Python 3.10+, so only install
      # them on demand.
      - when:
          condition: << parameters.install-docs >>
          steps:
            - run:
                command: |
                  . ~/venv/bin/activate
                  pip install ".[docs]"

      - save_cache:
          key: cache-v7-{{ arch }}-python<< parameters.python-version >>-<< parameters.chardet >>-{{ checksum "pyproject.toml" }}-{{ checksum "requirements-experimental.txt" }}
          paths:
            - ~/venv

jobs:
  test:
    parameters:
      base-image:
        type: string
        default: cimg/python
      python-version:
        type: string
      chardet:
        type: string
        default: ""
    working_directory: ~/web-monitoring-diff
    docker:
      - image: << parameters.base-image >>:<< parameters.python-version >>
    steps:
      - checkout
      - setup_pip:
          python-version: << parameters.python-version >>
          chardet: << parameters.chardet >>
      - run:
          name: Tests
          command: |
            . ~/venv/bin/activate
            coverage run -m pytest -vv
      - run:
          name: Coverage
          command: |
            . ~/venv/bin/activate
            coverage report -m

  lint:
    working_directory: ~/web-monitoring-diff
    docker:
      - image: cimg/python:<< pipeline.parameters.primary-python-version >>
    steps:
      - checkout
      - setup_pip:
          python-version: << pipeline.parameters.primary-python-version >>
      - run:
          name: Code linting
          command: |
            . ~/venv/bin/activate
            flake8 .

  build_docker:
    machine:
      image: ubuntu-2604:current
      docker_layer_caching: true
    environment:
      DOCKER_IMAGE: << pipeline.parameters.docker-image >>
    steps:
      - run:
          name: Upgrade curl
          command: sudo apt-get update && sudo apt-get install -y curl
      - checkout
      - run: |
          docker build -t "${DOCKER_IMAGE}:${CIRCLE_SHA1}" .
      - run:
          name: Smoketest
          command: |
            docker run --rm -p 8888:80 "${DOCKER_IMAGE}:${CIRCLE_SHA1}" &

            # Give server a moment to start.
            sleep 5

            # Does it respond successfully to some basic requests?
            curl --fail-with-body 'http://localhost:8888/'
            curl --fail-with-body 'http://localhost:8888/identical_bytes?a=https://example.com/&b=https://example.com/'

            kill %1
      - run:
          name: Save Image
          command: |
            mkdir /tmp/workspace
            docker save --output /tmp/workspace/docker-image "${DOCKER_IMAGE}:${CIRCLE_SHA1}"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - docker-image

  publish_docker:
    machine:
      image: ubuntu-2604:current
    environment:
      DOCKER_IMAGE: << pipeline.parameters.docker-image >>
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Load Built Docker Image
          command: docker load --input /tmp/workspace/docker-image
      - run:
          name: Docker Login
          command: docker login -u $DOCKER_USER -p $DOCKER_PASS
      # TODO: Drop these SHA-tagged builds in favor of just release numbers.
      # We maintain them for now for compatibility w/ a previous release style.
      - run:
          name: Publish Commit-SHA-Tagged Image
          command: docker push "${DOCKER_IMAGE}:${CIRCLE_SHA1}"
      - when:
          condition: << pipeline.git.branch == pipeline.parameters.edge-branch >>
          steps:
            - run:
                name: Publish :edge Tag
                command: |
                  docker image tag \
                    "${DOCKER_IMAGE}:${CIRCLE_SHA1}" \
                    "${DOCKER_IMAGE}:edge"
                  docker push "${DOCKER_IMAGE}:edge"
      - when:
          condition: << pipeline.git.tag starts-with "v" >>
          steps:
            - run:
                name: Publish Version-Tagged Image
                command: |
                  DOCKER_TAG="${CIRCLE_TAG:1}"
                  docker image tag \
                    "${DOCKER_IMAGE}:${CIRCLE_SHA1}" \
                    "${DOCKER_IMAGE}:${DOCKER_TAG}"
                  docker push "${DOCKER_IMAGE}:${DOCKER_TAG}"
      - when:
          # Skip tags with additional info after "v0.0.0", e.g. "v1.0.0a1"
          condition: << pipeline.git.tag matches /^v\d+(\.\d+)+$/ >>
          steps:
            - run:
                name: Publish :latest Tag For Final Releases
                command: |
                  docker image tag \
                    "${DOCKER_IMAGE}:${CIRCLE_SHA1}" \
                    "${DOCKER_IMAGE}:latest"
                  docker push "${DOCKER_IMAGE}:latest"

  # TODO: Publish to PyPI from CircleCI for version tags, similar to Docker.
  # publish_pypi:

workflows:
  build:
    jobs:
      # NOTE: because publishing runs on tags, we have to make sure all jobs
      # it depends on also run on tags (by default, jobs do not run on tags,
      # only branches).
      #
      # Also: {filters: {tags: {only: ...}}} may look deceiving, like it's only
      # running for the tags. But what's actually happening here is that
      # branches aren't being filtered (only tags are), so it's running for
      # *all* branches and also for tags that start with "v".
      #
      # See more in:
      # https://circleci.com/docs/2.0/workflows/#executing-workflows-for-a-git-tag
      - test:
          filters:
            tags:
              only: /^v.*/
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
              chardet: ["", "cchardet", "faust-cchardet"]
      # TODO: It looks like minidom/etree has gotten more strict in Python 3.16
      #  and causes some errors. We should fix this before it gets finalized.
      # - test:
      #     matrix:
      #       alias: test-python-pre
      #       parameters:
      #         base-image: ["mr0grog/circle-python-pre"]
      #         python-version: ["3.16.0a1", "3.16.0a1t"]
      - lint:
          filters:
            tags:
              only: /^v.*/
      - build_docker:
          filters:
            tags:
              only: /^v.*/
      # Publish public images from relevant branches and version tags.
      - publish_docker:
          requires:
            - test
            - lint
            - build_docker
          filters:
            branches:
              only:
                - main
                - edge-tags-are-useful-for-testing
            tags:
              only: /^v.*/
